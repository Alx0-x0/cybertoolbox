<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hash Lab - CyberToolBox</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23030712%22/><text x=%2250%22 y=%2250%22 font-family=%22monospace%22 font-weight=%22bold%22 font-size=%2260%22 fill=%22%23818cf8%22 text-anchor=%22middle%22 dy=%22.35em%22>&gt;_</text></svg>">
    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');</script>
    <link rel="stylesheet" href="../_shared/style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header id="tool-header-shell"></header>

        <main>
            <h1>Hash Lab</h1>
            <p class="subtitle" data-i18n="tool.hash.subtitle">Generate and verify SHA fingerprints for file integrity checks.</p>

            <div class="tool-interface">
                <div class="card">
                    <input id="fileInput" type="file" multiple hidden>
                    <div id="dropZone" class="drop-zone" role="button" tabindex="0" aria-label="Drop zone">
                        <i class="fa-solid fa-file-arrow-up"></i>
                        <p data-i18n="tool.hash.drop">Glissez-déposez vos fichiers ici</p>
                        <span data-i18n="tool.hash.or">ou</span>
                        <button type="button" id="browseBtn" class="browse-btn" data-i18n="tool.hash.browse">Parcourir les fichiers</button>
                    </div>
                    <div id="selectedInfo" class="selected-info" data-i18n="tool.hash.none">Aucun fichier sélectionné</div>
                    <div class="verify-row">
                        <select id="algoSelect">
                            <option value="SHA-256">SHA-256</option>
                            <option value="SHA-1">SHA-1</option>
                            <option value="SHA-512">SHA-512</option>
                        </select>
                        <input id="expectedInput" type="text" data-i18n-placeholder="tool.hash.expected_ph" placeholder="Expected hash (optional)">
                        <button type="button" id="computeBtn"><i class="fa-solid fa-fingerprint"></i> <span data-i18n="tool.hash.compute">Compute</span></button>
                    </div>
                    <div id="verifyResult" class="result-box" style="display:none;"></div>
                </div>

                <div id="hashTable" class="hash-table"></div>
            </div>
        </main>

        <footer>
            <p data-i18n="tool.common.footer">&copy; 2024 CyberToolBox. Développé par Alx0.</p>
        </footer>
    </div>

    <script src="../../src/js/utils/i18n.global.js"></script>
    <script src="../_shared/tool-shell.js"></script>
    <script src="script.js"></script>
    <script src="../_shared/transition.js"></script>
</body>
</html>
