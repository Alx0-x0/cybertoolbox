<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defang / Refang - CyberToolBox</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23030712%22/><text x=%2250%22 y=%2250%22 font-family=%22monospace%22 font-weight=%22bold%22 font-size=%2260%22 fill=%22%23818cf8%22 text-anchor=%22middle%22 dy=%22.35em%22>&gt;_</text></svg>">
    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');</script>
    <link rel="stylesheet" href="../_shared/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
    <div class="container">
        <header id="tool-header-shell"></header>
        <main>
            <h1 data-i18n="tool.defang.title">Defang / Refang</h1>
            <p class="subtitle" data-i18n="tool.defang.subtitle">Neutralisez des IOCs pour partager sans clic accidentel.</p>
            <div class="tool-interface">
                <textarea id="src" rows="12" data-i18n-placeholder="tool.defang.input_ph" placeholder="Collez URLs, domaines, emails, IPs..."></textarea>
                <div class="action-buttons">
                    <button type="button" id="defangBtn" data-i18n="tool.defang.defang">Defang</button>
                    <button type="button" id="refangBtn" data-i18n="tool.defang.refang">Refang</button>
                    <button type="button" id="copyBtn" data-i18n="tool.defang.copy">Copier</button>
                </div>
                <textarea id="out" rows="12" readonly></textarea>
            </div>
        </main>
        <footer><p data-i18n="tool.common.footer">&copy; 2024 CyberToolBox. Développé par Alx0.</p></footer>
    </div>
    <script src="../../src/js/utils/i18n.global.js"></script>
    <script src="../_shared/tool-shell.js"></script>
    <script src="script.js"></script>
