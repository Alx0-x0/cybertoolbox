<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo IP - CyberToolBox</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><defs><style>@media(prefers-color-scheme:light){rect{fill:%23f8fafc}text{fill:%236366f1}}</style></defs><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23030712%22/><text x=%2250%22 y=%2250%22 font-family=%22monospace%22 font-weight=%22bold%22 font-size=%2260%22 fill=%22%23818cf8%22 text-anchor=%22middle%22 dy=%22.35em%22>&gt;_</text></svg>">

    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');</script>
    <link rel="stylesheet" href="../_shared/style.css">
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>

    <div class="container">
        <header id="tool-header-shell"></header>

        <main>
            <h1>Geo IP</h1>
            <p class="subtitle" data-i18n="tool.geo.subtitle">Localisez géographiquement une adresse IP et obtenez des détails FAI.</p>

            <div class="tool-interface">
                <div class="search-box">
                    <input type="text" id="ipInput" data-i18n-placeholder="tool.geo.input_ph" placeholder="Entrez une adresse IP (ex: 8.8.8.8)...">
                    <button id="myIpBtn" class="btn-icon" data-i18n-title="tool.geo.my_ip" title="Localiser mon IP publique"><i class="fa-solid fa-house-signal"></i></button>
                    <button id="searchBtn">
                        <span id="btnText" data-i18n="tool.geo.locate">Localiser</span>
                        <i id="btnLoader" class="fa-solid fa-circle-notch fa-spin" style="display:none;"></i>
                    </button>
                </div>

                <div id="errorMsg" class="error-message" style="display:none;"></div>

                <div class="results-grid">
                    <div class="geo-card geo-type-ip">
                        <div class="geo-card-header"><h3><i class="fa-solid fa-network-wired"></i> <span data-i18n="tool.geo.ip_address">Adresse IP</span></h3></div>
                        <div class="geo-card-body">
                            <div class="geo-row main-row">
                                <span id="displayIP" class="geo-value-highlight">---</span>
                                <button id="copyBtn" class="copy-btn" data-i18n-title="tool.common.copy" title="Copier"><i class="fa-regular fa-copy"></i></button>
                            </div>
                            <div class="geo-row"><span class="geo-label">Type:</span> <span id="ipType" class="geo-badge">IPv4</span></div>
                        </div>
                    </div>

                    <div class="geo-card geo-type-loc">
                        <div class="geo-card-header"><h3><i class="fa-solid fa-location-dot"></i> <span data-i18n="tool.geo.loc_title">Localisation</span></h3></div>
                        <div class="geo-card-body">
                            <div class="geo-row"><span class="geo-label" data-i18n="tool.geo.city_country">Ville/Pays</span>:<span class="geo-badge-container"><img id="flag" src="" alt="" style="display:none; height: 14px; margin-right:5px;"><span id="displayLocation">---</span></span></div>
                            <div class="geo-row"><span class="geo-label" data-i18n="tool.geo.region">Région</span>: <span id="displayRegion" class="geo-badge">---</span></div>
                        </div>
                    </div>

                    <div class="geo-card geo-type-isp">
                        <div class="geo-card-header"><h3><i class="fa-solid fa-server"></i> <span data-i18n="tool.geo.isp_title">FAI (ISP)</span></h3></div>
                        <div class="geo-card-body">
                            <div class="geo-row"><span class="geo-label">Org:</span> <span id="displayISP" class="geo-badge" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px;">---</span></div>
                            <div class="geo-row"><span class="geo-label">ASN:</span> <span id="displayASN" class="geo-badge">---</span></div>
                        </div>
                    </div>

                    <div class="geo-card geo-type-coords">
                        <div class="geo-card-header"><h3><i class="fa-solid fa-compass"></i> <span data-i18n="tool.geo.coords_title">Coordonnées</span></h3></div>
                        <div class="geo-card-body">
                            <div class="geo-row"><span class="geo-label">GPS:</span><span class="geo-badge"><span id="displayLat">---</span>, <span id="displayLon">---</span></span></div>
                            <div class="geo-row"><span class="geo-label">Zone:</span> <span id="displayTimezone" class="geo-badge">---</span></div>
                        </div>
                    </div>
                </div>

                <div id="map" class="map-container"></div>
            </div>
        </main>

        <footer><p data-i18n="tool.common.footer">&copy; 2024 CyberToolBox. Développé par Alx0.</p></footer>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="../../src/js/utils/i18n.global.js"></script>
    <script src="../_shared/tool-shell.js"></script>
    <script src="script.js"></script>
    <script src="../_shared/transition.js"></script>
</body>
</html>
